# Ruff configuration — keeps CI honest about real bugs without churning style.

line-length = 120
target-version = "py311"

[lint]
# Default rules (E, F, etc.) catch real bugs.
# Ignored: stylistic checks that don't fit the project's compact-statement preference.
ignore = ["E701", "E702", "E501"]

[lint.per-file-ignores]
"tests/**" = ["S101"]
